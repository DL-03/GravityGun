message.gg.help: "<b><gold>=== Команды Gravity Gun ===</gold></b>\n
   <click:run_command:'/gg help'><gold>/gg help</click> - показать этот список команд\n
   <click:run_command:'/gg reload'><gold>/gg reload</click> - перезагрузить конфигурацию плагина\n
   <click:run_command:'/gg give'><gold>/gg give</click> - дать гравитационную пушку себе или другому игроку\n
   <click:run_command:'/gg fix'><gold>/gg fix</click> - починить гравитацию и коллизию игрока после неудачного захвата игрока"
message.gg.help: "<b><gold>=== Команди Gravity Gun ===</gold></b>\n
   <click:run_command:“/gg help”><gold>/gg help</click> — показати цей список команд\n
   <click:run_command:“/gg reload”><gold>/gg reload</click> — перезавантажити конфігурацію плагіна\n
   <click:run_command:“/gg give”><gold>/gg give</click> — дати гравітаційну пушку собі або іншому гравцю\n
   <click:run_command:“/gg fix”><gold>/gg fix</click> — відновити гравітацію та колізію гравця після невдалого захоплення гравця"